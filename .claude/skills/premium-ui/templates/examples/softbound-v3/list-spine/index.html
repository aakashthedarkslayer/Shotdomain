<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Softbound v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap">
<style>
:root{--ink:#2B2A4A;--mut:#7E7890;--paper:#FFFCF7;--fd:'Bricolage Grotesque',system-ui,sans-serif;--k:1;
  --bg1:#F6EEE4;--bg2:#EBDDCD;--glow:rgba(255,236,206,.9)}
:root[data-time="morning"]{--bg1:#F2F1EE;--bg2:#DFE2E6;--glow:rgba(236,244,255,.95)}
:root[data-time="night"]{--bg1:#2A2433;--bg2:#17131D;--glow:rgba(255,184,110,.22)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(60% 55% at 70% 18%,var(--glow),rgba(0,0,0,0) 70%),linear-gradient(180deg,var(--bg1),var(--bg2));transition:background 1.2s;
  font-family:var(--fd);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
:root[data-time="night"] body{color:#EFE6DA}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.cap{margin:0;font:500 15px/1.3 var(--fd);letter-spacing:-.01em;opacity:.78;text-align:center;padding:0 16px}
.cap b{font-weight:700}
.wrap{width:calc(414px*var(--k));height:calc(868px*var(--k));flex:none;position:relative}
.phone{position:absolute;left:0;top:0;width:414px;height:868px;transform:scale(var(--k));transform-origin:0 0;border-radius:62px;padding:12px;background:#111014;
  box-shadow:0 0 0 1.5px #3A3840 inset,0 2px 4px rgba(0,0,0,.2),0 50px 90px -30px rgba(60,30,10,.55),0 20px 40px -20px rgba(0,0,0,.35)}
.phone::before{content:"";position:absolute;top:24px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#0B0A0D;z-index:50;pointer-events:none}
#screen{width:390px;height:844px;border-radius:50px;overflow:hidden;position:relative;isolation:isolate;background:#EFE4D6}
.ctl{display:flex;gap:10px}
.ctl button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:99px;background:rgba(255,253,249,.8);color:#2B2A4A;
  font:600 13px var(--fd);box-shadow:0 1px 1px rgba(80,50,40,.08),0 10px 22px -14px rgba(80,50,40,.6);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ctl button:active{transform:scale(.93)}
.ctl button:focus-visible{outline:2px solid #2B2A4A;outline-offset:2px}
@media (max-height:640px){.cap{display:none}}
</style>
</head>
<body>
<main class="stage">
  <p class="cap"><b>Softbound.</b> Every note is a little clay hardcover on a sunlit shelf.</p>
  <div class="wrap"><div class="phone"><div id="screen" aria-label="Softbound app"></div></div></div>
  <div class="ctl"><button id="snd" aria-pressed="false">Sound off</button><button id="replay">Replay</button></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="src/notes.js"></script>
<script src="src/art.js"></script>
<script src="src/alive.js"></script>
<script src="src/sound.js"></script>
<script src="src/book.js"></script>
<script src="src/open.js"></script>
<script src="src/scene.js"></script>
<script src="src/binview.js"></script>
<script src="src/cord.js"></script>
<script src="src/spine.js"></script>
</body>
</html>
