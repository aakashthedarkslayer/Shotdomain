<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3ECE3;--ink:#2B2A4A;--mut:#7A7090;--card:#FBF7F1}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Bricolage Grotesque',system-ui,sans-serif;padding:24px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:28px 0 10px}
#t{color:var(--mut);margin:0 0 18px;white-space:pre-wrap}
.grid{display:grid;grid-template-columns:90px repeat(4,240px);gap:12px;align-items:center}
.grid .h{font-weight:600;color:var(--mut);text-align:center}
.tag{font-weight:600}
.cell{width:240px;height:320px;border-radius:6px;overflow:hidden;background:#ddd;box-shadow:0 2px 10px rgba(43,42,74,.12)}
.cell canvas,.cell svg{width:100%;height:100%;display:block}
.sw{display:flex;gap:14px;flex-wrap:wrap}
.sw figure{margin:0;text-align:center;color:var(--mut);font-size:12px}
.sw .tile{width:192px;height:192px;background-size:96px 96px;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.1)}
#zoom{display:none;position:absolute;left:0;top:0;background:var(--bg);padding:0}
#zoom canvas{display:block;width:768px;height:1024px}
#trio{display:none;position:absolute;left:0;top:0;background:var(--bg);padding:8px;gap:8px}
#trio canvas{display:block;width:384px;height:512px}
</style></head><body>
<h1>Softbound v3 · art lab</h1>
<p id="t">painting…</p>
<div class="grid" id="g"><div></div><div class="h">v2 (flat SVG)</div><div class="h">morning</div><div class="h">golden</div><div class="h">night</div></div>
<h2>Linen (2×2 tiled, then normal map) and paper</h2>
<div class="sw" id="sw"></div>
<div id="zoom"></div><div id="trio"></div>
<script src="src/art.js"></script>
<script>
window.V2ART=(function(){
const f=n=>Math.round(n*10)/10;
/* ---------- illustration kit ---------- */
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const st=s=>s.map(([o,c,a])=>`<stop offset="${o}" stop-color="${c}"${a!=null?` stop-opacity="${a}"`:''}/>`).join('');
const LG=(id,s,x1=0,y1=0,x2=0,y2=1)=>`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${st(s)}</linearGradient>`;
const LGU=(id,s,x1,y1,x2,y2)=>`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${st(s)}</linearGradient>`;
const RG=(id,s,cx,cy,r)=>`<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${cx}" cy="${cy}" r="${r}">${st(s)}</radialGradient>`;
const RGO=(id,s,cx=.38,cy=.35,r=.75)=>`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${st(s)}</radialGradient>`;

function flower(x,y,r,rot,fill,eye){let p='';for(let k=0;k<5;k++)p+=`<ellipse cx="0" cy="${f(-r*.55)}" rx="${f(r*.44)}" ry="${f(r*.6)}" transform="rotate(${k*72})"/>`;return `<g transform="translate(${f(x)},${f(y)}) rotate(${rot|0})"><g fill="${fill}">${p}</g><circle r="${f(r*.24)}" fill="${eye}"/></g>`}
function bloom(R,cx,cy,sp){let a='',b='',c='',fl='';const n=Math.round(sp*1.2);
  for(let i=0;i<n;i++){const t=R()*6.283,r=Math.sqrt(R())*sp,x=cx+Math.cos(t)*r,y=cy+Math.sin(t)*r*.72,s=3.2+R()*4.6;
    a+=`<circle cx="${f(x+1.6)}" cy="${f(y+2.2)}" r="${f(s)}"/>`;b+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(s)}"/>`;
    if(R()<.55)c+=`<circle cx="${f(x-s*.3)}" cy="${f(y-s*.38)}" r="${f(s*.46)}"/>`;}
  for(let i=0;i<3;i++){const t=R()*6.283,r=R()*sp*.8;fl+=flower(cx+Math.cos(t)*r,cy+Math.sin(t)*r*.7-2,4.6+R()*2,R()*72,'#FFEFF3','#E0668A')}
  return `<g fill="#D9789A">${a}</g><g fill="#F4ABC0">${b}</g><g fill="#FFD3DF">${c}</g>${fl}`}
function pagoda(x,b,s){let o=`<rect x="${f(x-32*s)}" y="${f(b-5*s)}" width="${f(64*s)}" height="${f(9*s)}" rx="${f(1.5*s)}" fill="#3A2C5C"/>`;let y=b-5*s;
  for(let i=0;i<5;i++){const w=(56-i*8)*s,bh=(i?9.5:12)*s;
    o+=`<rect x="${f(x-w*.34)}" y="${f(y-bh)}" width="${f(w*.68)}" height="${f(bh)}" fill="#4B3A74"/><rect x="${f(x+w*.12)}" y="${f(y-bh)}" width="${f(w*.22)}" height="${f(bh)}" fill="#5D4A88"/>`;
    o+=`<rect x="${f(x-w*.09)}" y="${f(y-bh+2.6*s)}" width="${f(w*.18)}" height="${f(bh-4*s)}" rx="${f(.8*s)}" fill="#FFC98E"/>`;
    y-=bh;const rw=w*.5+9*s,rh=6.5*s;
    o+=`<path d="M${f(x-rw-5*s)},${f(y-1.5*s)} Q${f(x-rw+3*s)},${f(y+.5*s)} ${f(x-rw*.6)},${f(y-rh)} L${f(x+rw*.6)},${f(y-rh)} Q${f(x+rw-3*s)},${f(y+.5*s)} ${f(x+rw+5*s)},${f(y-1.5*s)} Q${f(x)},${f(y+3.2*s)} ${f(x-rw-5*s)},${f(y-1.5*s)}Z" fill="#30244E"/>`;
    o+=`<path d="M${f(x+rw*.15)},${f(y-rh)} L${f(x+rw*.6)},${f(y-rh)} Q${f(x+rw-3*s)},${f(y+.5*s)} ${f(x+rw+5*s)},${f(y-1.5*s)}" stroke="#C7A8E0" stroke-width="${f(1.1*s)}" fill="none" stroke-linecap="round" opacity=".75"/>`;
    y-=rh;}
  o+=`<rect x="${f(x-1.1*s)}" y="${f(y-24*s)}" width="${f(2.2*s)}" height="${f(24*s)}" fill="#30244E"/>`;
  for(let k=0;k<5;k++)o+=`<rect x="${f(x-3*s)}" y="${f(y-6*s-k*3.4*s)}" width="${f(6*s)}" height="${f(1.4*s)}" rx="${f(.7*s)}" fill="#30244E"/>`;
  return o}
function torii(x,b,h){const c='#D44C5E',cd='#A9364A';return `<g><rect x="${x-16}" y="${b-h}" width="3.6" height="${h}" fill="${c}"/><rect x="${x+12.4}" y="${b-h}" width="3.6" height="${h}" fill="${cd}"/><rect x="${x-19}" y="${b-h+7}" width="38" height="3" fill="${cd}"/><rect x="${x-21}" y="${b-h}" width="42" height="3.4" fill="${c}"/><path d="M${x-27},${b-h-1.5} Q${x},${b-h+1.5} ${x+27},${b-h-1.5} L${x+25},${b-h-5.5} Q${x},${b-h-2.5} ${x-25},${b-h-5.5}Z" fill="#2E2340"/><rect x="${x-1.5}" y="${b-h+3}" width="3" height="4.5" fill="${cd}"/></g>`}
function cloud(x,y,s,sh){return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-44,12 C-52,-2 -36,-14 -24,-8 C-22,-26 4,-32 12,-14 C20,-24 40,-18 36,-2 C50,-2 52,12 40,14 L-38,14 C-46,14 -48,12 -44,12Z" fill="#FFFFFF"/><path d="M-44,12 C-30,4 30,4 44,12 C46,13 42,14 40,14 L-38,14 C-44,14 -46,13 -44,12Z" fill="${sh}"/></g>`}
function skyline(R,x0,x1,base,hmin,hmax,wmin,wmax,fill,win,lit,cap,face,wp=.4){let s='',w='',x=x0;
  while(x<x1){const bw=wmin+R()*(wmax-wmin),bh=hmin+R()*(hmax-hmin),top=base-bh;
    s+=`<rect x="${f(x)}" y="${f(top)}" width="${f(bw)}" height="${f(bh+80)}"/>`;
    const k=R();if(k<.16)s+=`<rect x="${f(x+bw/2-.8)}" y="${f(top-12)}" width="1.6" height="12"/>`;else if(k<.26)s+=`<path d="M${f(x)},${f(top)} L${f(x+bw/2)},${f(top-9)} L${f(x+bw)},${f(top)}Z"/>`;else if(k<.36)s+=`<rect x="${f(x+3)}" y="${f(top-5)}" width="${f(bw-6)}" height="5"/>`;
    if(face)w+=`<rect x="${f(x)}" y="${f(top)}" width="${f(bw*.28)}" height="${f(bh+80)}" fill="${face}"/>`;
    if(cap)w+=`<rect x="${f(x)}" y="${f(top)}" width="${f(bw)}" height="1.6" fill="${cap}"/>`;
    if(win&&R()<wp){const cx=x+bw*.32;for(let yy=top+8;yy<base-6;yy+=11)for(let xx=cx;xx<x+bw-6;xx+=7){const L=R()<lit;w+=`<rect x="${f(xx)}" y="${f(yy)}" width="3" height="5" rx=".6" fill="${L?'#FFD8A0':win}"${L?'':' opacity=".5"'}/>`}}
    x+=bw+(R()<.3?2.5:0)}
  return `<g fill="${fill}">${s}</g>${w}`}
function leaf(x,y,s,rot,c,v){return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(rot)}) scale(${s})"><path d="M0,0 C-10,-5 -12,-20 0,-31 C12,-20 10,-5 0,0Z" fill="${c}"/><path d="M0,-2 C-1,-12 0,-20 0,-28" stroke="${v}" stroke-width="1.1" fill="none" opacity=".7"/></g>`}
function monstera(x,y,s,rot,c,v){return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(rot)}) scale(${s})"><path d="M0,0 C-24,-2 -34,-28 -18,-44 C-10,-52 -2,-48 0,-42 C2,-48 10,-52 18,-44 C34,-28 24,-2 0,0Z" fill="${c}"/><g stroke="${v}" stroke-width="1.3" fill="none" opacity=".75" stroke-linecap="round"><path d="M0,-2 L0,-40"/><path d="M0,-12 L-18,-20"/><path d="M0,-12 L18,-20"/><path d="M0,-24 L-20,-34"/><path d="M0,-24 L20,-34"/></g></g>`}

const SCENES={
Travel(u,R){
  const d=LG(u+'sk',[[0,'#A39AD6'],[.36,'#DAB4D7'],[.64,'#F6CCC7'],[1,'#FDE4CF']])+RG(u+'sun',[[0,'#FFF8EC'],[.2,'#FFEBD8',.95],[1,'#FFD6C6',0]],300,134,165)
   +LG(u+'m0',[[0,'#D3C1E5'],[1,'#F2DDE8']])+LG(u+'m1',[[0,'#B7A3D9'],[1,'#E0C6E0']])+LG(u+'m2',[[0,'#9581C6'],[1,'#B49DD2']])+LG(u+'m3',[[0,'#6A579F'],[1,'#544288']])+LG(u+'m4',[[0,'#3D2F6E'],[1,'#241C46']])
   +LG(u+'hz',[[0,'#FFF',0],[.55,'#FFEFF2',.65],[1,'#FFF',0]])+LG(u+'wa',[[0,'#EFD0DF'],[.35,'#D2BCE2'],[1,'#8E7BC0']])
   +`<clipPath id="${u}wc"><rect x="-30" y="238" width="460" height="110"/></clipPath>`;
  const ridge=(p,x)=>{for(let i=1;i<p.length;i++)if(x<=p[i][0]){const[a,b]=p[i-1],[c,e]=p[i];return b+(e-b)*(x-a)/(c-a)}return p[p.length-1][1]};
  const LH=[[-30,222],[30,210],[90,207],[150,218],[214,240]];
  const cone=(x,b,h)=>`<path d="M${f(x)},${f(b-h)} C${f(x+5)},${f(b-h*.55)} ${f(x+7)},${b} ${f(x)},${b} C${f(x-7)},${b} ${f(x-5)},${f(b-h*.55)} ${f(x)},${f(b-h)}Z"/>`;
  let conif='';for(let x=-24;x<190;x+=6+R()*6)conif+=cone(x,ridge(LH,x)+8,14+R()*14);for(let x=232;x<430;x+=7+R()*7)conif+=cone(x,228,10+R()*12);
  let cherry='';[[4,.9],[38,1.1],[70,.85],[128,1],[162,.8]].forEach(([x,s])=>{const y=ridge(LH,x)+2;let a='',b='',c='';for(let i=0;i<9;i++){const dx=(R()-.5)*20*s,dy=(R()-.5)*10*s,r=(4.5+R()*3.5)*s;a+=`<circle cx="${f(x+dx+1)}" cy="${f(y-15*s+dy+1.5)}" r="${f(r)}"/>`;b+=`<circle cx="${f(x+dx)}" cy="${f(y-15*s+dy)}" r="${f(r)}"/>`;if(R()<.5)c+=`<circle cx="${f(x+dx-r*.3)}" cy="${f(y-15*s+dy-r*.35)}" r="${f(r*.45)}"/>`}
    cherry+=`<path d="M${x},${f(y)} L${x},${f(y-11*s)} M${x},${f(y-6*s)} l${f(5*s)},${f(-6*s)}" stroke="#5B4277" stroke-width="${f(2*s)}" stroke-linecap="round"/><g fill="#D58CB4">${a}</g><g fill="#EFB4CF">${b}</g><g fill="#FCD9E6">${c}</g>`});
  const hills=`<path d="M-30,222 C30,206 90,204 150,218 C180,226 200,236 214,240 L-30,240Z" fill="url(#${u}m2)"/><path d="M190,240 C228,226 262,212 300,212 C342,210 384,220 430,216 V240Z" fill="url(#${u}m2)"/>`;
  const bush=(x,y,r,c)=>`<path d="M${x-r},${y} A${r},${r*.8} 0 0 1 ${x+r},${y}Z" fill="${c}"/>`;
  const pg=pagoda(300,216,1.05)+bush(270,218,11,'#7C68AD')+bush(330,217,13,'#7C68AD')+bush(344,219,8,'#6F5BA3')+bush(282,221,7,'#6F5BA3');
  let petals='';for(let i=0;i<16;i++){const x=f(R()*400),y=f(80+R()*210);petals+=`<ellipse cx="${x}" cy="${y}" rx="${f(2+R()*1.6)}" ry="${f(1.2+R())}" transform="rotate(${f(R()*180)} ${x} ${y})" fill="#F8BACB" opacity="${f(.6+R()*.4)}"/>`}
  let reeds='';for(let i=0;i<12;i++){const x=332+i*8+R()*5,h=34+R()*30,b=f(-R()*6-4);reeds+=`<path d="M${f(x)},340 Q${f(x+b*.4)},${f(340-h*.6)} ${f(x+b)},${f(340-h)}" stroke-width="${f(1.6+R())}"/>`;if(i%3===1)reeds+=`<ellipse cx="${f(x+b)}" cy="${f(340-h+5)}" rx="2.4" ry="6" fill="#3D2F6E" stroke="none"/>`}
  const L0=`<rect x="-30" y="-30" width="460" height="380" fill="url(#${u}sk)"/><circle cx="300" cy="134" r="165" fill="url(#${u}sun)"/><circle cx="300" cy="134" r="24" fill="#FFF8EE"/>
   <g fill="#FFF" opacity=".55"><rect x="30" y="74" width="130" height="5" rx="2.5"/><rect x="62" y="85" width="74" height="3.5" rx="1.75"/><rect x="236" y="58" width="120" height="5" rx="2.5"/><rect x="276" y="68" width="64" height="3.5" rx="1.75"/><rect x="180" y="104" width="60" height="3" rx="1.5"/></g>
   <g fill="none" stroke="#6E5B96" stroke-width="1.4" stroke-linecap="round" opacity=".75"><path d="M214,92 q4,-4.5 8,0 q4,-4.5 8,0"/><path d="M238,80 q3,-3.5 6,0 q3,-3.5 6,0"/><path d="M196,106 q2.5,-3 5,0 q2.5,-3 5,0"/></g>`;
  const L1=`<path d="M-30,178 L30,150 L72,164 L120,138 L170,158 L228,128 L282,156 L340,146 L430,166 V340 H-30Z" fill="url(#${u}m0)" opacity=".9"/>
   <path d="M-30,200 L18,170 L50,180 L94,136 L118,150 L150,118 L188,158 L214,146 L250,176 L282,172 L332,186 L368,158 L430,182 V340 H-30Z" fill="url(#${u}m1)"/>
   <g fill="#F8E8F0" opacity=".8"><path d="M150,118 L166,136 L158,139 L174,152 L188,158 L170,155 L160,146 L152,148Z"/><path d="M94,136 L108,146 L102,149 L118,150 L104,154Z"/><path d="M368,158 L384,168 L376,170 L396,174Z"/></g>
   <g fill="#A592CF" opacity=".5"><path d="M150,118 L136,140 L128,160 L120,158 L140,128Z"/><path d="M94,136 L80,152 L70,170 L84,150Z"/></g>
   <rect x="-30" y="150" width="460" height="100" fill="url(#${u}hz)"/>`;
  const L2=`<g fill="#8A75B8">${conif}</g>${hills}${cherry}${pg}
   <rect x="-30" y="238" width="460" height="110" fill="url(#${u}wa)"/>
   <g clip-path="url(#${u}wc)"><g transform="translate(0,478) scale(1,-1)" opacity=".26">${hills}${pagoda(300,216,1.05)}</g></g>
   <path d="M-30,238.6 H430" stroke="#F8E2EC" stroke-width="1.2" opacity=".9"/>
   <g fill="#FFF7EE"><rect x="282" y="246" width="38" height="2" rx="1" opacity=".85"/><rect x="290" y="252" width="24" height="1.8" rx=".9" opacity=".75"/><rect x="278" y="258" width="44" height="1.8" rx=".9" opacity=".6"/><rect x="292" y="265" width="18" height="1.6" rx=".8" opacity=".55"/><rect x="284" y="272" width="30" height="1.6" rx=".8" opacity=".4"/></g>
   <g stroke="#F3E3F1" stroke-width="1" opacity=".45" stroke-linecap="round"><path d="M40,250 h40 M120,262 h30 M220,256 h36 M350,250 h44 M360,280 h30 M200,290 h40"/></g>`;
  const lantern=(x,b)=>`<g><rect x="${x-5}" y="${b-3}" width="10" height="3" fill="#47387A"/><rect x="${x-1.6}" y="${b-12}" width="3.2" height="9" fill="#47387A"/><rect x="${x-4.5}" y="${b-20}" width="9" height="8" rx="1" fill="#47387A"/><rect x="${x-2.6}" y="${b-18.5}" width="5.2" height="5" fill="#FFD7A0"/><path d="M${x-8},${b-20} L${x},${b-26} L${x+8},${b-20}Z" fill="#3B2E68"/><circle cx="${x}" cy="${b-16}" r="9" fill="#FFD7A0" opacity=".18"/></g>`;
  const L3=`<path d="M-30,262 C30,250 110,248 170,260 C204,268 226,282 244,300 L-30,300Z" fill="url(#${u}m3)"/><path d="M-30,262 C30,250 110,248 170,260 C204,268 226,282 244,300" stroke="#9D89CC" stroke-width="1.4" fill="none" opacity=".7"/>
   ${torii(104,258,34)}${lantern(168,264)}${bush(52,256,12,'#5B4892')}${bush(140,258,9,'#5B4892')}${bush(200,272,10,'#4E3D86')}
   <g clip-path="url(#${u}wc)"><g transform="translate(0,${2*262}) scale(1,-1)" opacity=".18">${torii(104,258,34)}</g></g>`;
  const L4=`<path d="M-30,300 C60,288 140,292 200,304 C246,314 282,324 306,350 L-30,350Z" fill="url(#${u}m4)"/>
   <g fill="none" stroke="#2F2558" stroke-linecap="round">${reeds}</g>
   <g stroke="#6A57A2" stroke-width="1.2" stroke-linecap="round" opacity=".8" fill="none"><path d="M30,302 l-2,-7 M34,302 l1,-8 M120,300 l-2,-6 M124,300 l2,-7 M190,306 l-1,-7"/></g>
   <g fill="none" stroke-linecap="round" stroke="#4A2E44"><path d="M-30,22 C10,28 40,44 76,52 C104,58 130,58 162,68" stroke-width="7"/><path d="M76,52 C104,58 130,58 162,68" stroke-width="4.5"/><path d="M68,49 C80,36 94,30 116,28" stroke-width="3.2"/><path d="M118,58 C130,72 140,82 154,90" stroke-width="2.6"/><path d="M430,8 C400,16 372,22 344,40" stroke-width="6"/><path d="M382,18 C374,8 362,4 348,6" stroke-width="2.6"/></g>
   ${bloom(R,6,28,16)}${bloom(R,42,40,18)}${bloom(R,78,52,20)}${bloom(R,112,30,15)}${bloom(R,130,60,17)}${bloom(R,162,68,13)}${bloom(R,152,90,10)}${bloom(R,404,14,16)}${bloom(R,364,28,18)}${bloom(R,342,44,12)}${bloom(R,350,6,10)}${petals}`;
  return {d,L:[L0,L1,L2,L3,L4]}},

Recipes(u,R){
  const d=LG(u+'w',[[0,'#FDE9D3'],[1,'#F5CDAC']])+LG(u+'c',[[0,'#D69A6A'],[1,'#A9683D']])+LG(u+'pot',[[0,'#174B50'],[.3,'#2D7F84'],[.52,'#5BAEAB'],[.7,'#2C7B80'],[1,'#123F44']],0,0,1,0)
   +RGO(u+'dal',[[0,'#E7A04C'],[.7,'#B8662A'],[1,'#8A461C']],.5,.4,.7)+LGU(u+'st',[[0,'#FFFFFF',.9],[1,'#FFFFFF',0]],0,150,0,40)+RG(u+'gl',[[0,'#FFF4E4',.85],[1,'#FFF4E4',0]],300,40,190)
   +LG(u+'bw',[[0,'#46679C'],[1,'#2C477A']]);
  let tiles='';for(let y=126;y<220;y+=19)tiles+=`<path d="M-30,${y} H430"/>`;for(let y=126,r=0;y<220;y+=19,r++)for(let x=-30+(r%2?14:0);x<430;x+=28)tiles+=`<path d="M${x},${y} v19"/>`;
  let grain='';for(let i=0;i<9;i++){const y=236+i*11+R()*4;grain+=`<path d="M-30,${f(y)} C80,${f(y-3+R()*6)} 200,${f(y+R()*5)} 430,${f(y-2)}"/>`}

   <g stroke="#F2F7F8" stroke-width="1.1" stroke-linecap="round" opacity=".5">${rain}</g>`;
  const L1=`<path d="M-30,-30 H430 V340 H-30Z M74,38 H270 V204 H74Z" fill="url(#${u}w)" fill-rule="evenodd"/><rect x="-30" y="-30" width="460" height="380" fill="url(#${u}lg)"/>

  const L2=`<rect x="-30" y="206" width="460" height="134" fill="url(#${u}desk)"/><rect x="-30" y="204" width="460" height="7" fill="#C08B63"/><rect x="-30" y="204" width="460" height="2" fill="#DDAA80"/><rect x="-30" y="211" width="460" height="5" fill="#3A2416" opacity=".25"/>
   <path d="M316,96 L360,96 L404,206 L268,206Z" fill="url(#${u}cone)"/><ellipse cx="320" cy="222" rx="120" ry="20" fill="url(#${u}pool)"/>
   <g fill="none" stroke="#5E3A26" stroke-width="1" opacity=".35"><path d="M-30,236 C80,232 200,240 430,234"/><path d="M-30,252 C100,248 220,256 430,250"/><path d="M-30,276 C90,270 240,280 430,272"/><path d="M-30,300 C120,296 260,304 430,298"/></g>`;
  const L3=`${book(226,190,104,15,'#3F5A8A','#E8C77A')}${book(234,176,92,14,'#D98E88','#FFF2E4')}${book(230,163,98,13,'#E7B55B','#8A5A1E')}${book(240,149,84,14,'#7FAA8F','#F7F0E2')}
   <g><rect x="258" y="128" width="22" height="21" rx="4" fill="#F5EFE7"/><path d="M280,132 a5.5,5.5 0 0 1 0,11" stroke="#F5EFE7" stroke-width="2.6" fill="none"/><ellipse cx="269" cy="129" rx="10" ry="2.4" fill="#8A5634"/><rect x="261" y="133" width="3" height="12" rx="1.5" fill="#FFF" opacity=".7"/>
    <path d="M266,122 C262,114 272,110 268,100" stroke="url(#${u}st)" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M273,122 C277,116 270,110 274,104" stroke="url(#${u}st)" stroke-width="2" fill="none" stroke-linecap="round"/></g>
   <g><ellipse cx="340" cy="206" rx="20" ry="4.5" fill="#B58A45"/><rect x="321" y="200" width="38" height="6" rx="3" fill="#D3A75A"/><rect x="337" y="96" width="5" height="106" fill="#C49A52"/><rect x="337" y="96" width="1.6" height="106" fill="#EBCB8A"/>
    <path d="M312,98 L368,98 L356,58 L324,58Z" fill="url(#${u}shade)"/><ellipse cx="340" cy="98" rx="28" ry="4" fill="#FFF6DA"/><path d="M324,58 L356,58" stroke="#FFF4D6" stroke-width="2"/></g>

};
let seq=0;
const SEED={Travel:7,Recipes:11,Personal:23,Work:5,Reading:31};
function art(tag){const s=SCENES[tag]?tag:'Travel',u='ma'+(++seq)+'_',sc=SCENES[s](u,mb(SEED[s]));
  return `<svg viewBox="0 0 400 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><defs>${sc.d}</defs>${sc.L.map((l,i)=>`<g class="ly" data-d="${i}">${l}</g>`).join('')}</svg>`}

return art;})();

</script>
<script>
const TAGS=['Travel','Recipes','Personal','Work','Reading','Ideas'], TIMES=['morning','golden','night'];
const CLOTH={Travel:'#A9C8EE',Recipes:'#F5B98A',Personal:'#EFB3C2',Work:'#A8DCC4',Reading:'#F3DB8C',Ideas:'#CDBDF2'};
const g=document.getElementById('g'), cells={};
for(const tag of TAGS){
  const l=document.createElement('div');l.className='tag';l.textContent=tag;g.appendChild(l);
  const v=document.createElement('div');v.className='cell';v.id='v2-'+tag;
  v.innerHTML=tag==='Ideas'?'<div style="display:grid;place-items:center;height:100%;color:#7A7090">no v2 art</div>':V2ART(tag).replace('<svg ','<svg width="240" height="320" ');
  g.appendChild(v);
  for(const t of TIMES){const c=document.createElement('div');c.className='cell';c.id=tag+'-'+t;g.appendChild(c);cells[tag+'-'+t]=c;}
}
function show(el,cv){const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;c.getContext('2d').drawImage(cv,0,0);el.innerHTML='';el.appendChild(c);return c;}
window.zoom=async(tag,time)=>{const z=document.getElementById('zoom');show(z,await SBArt.cover(tag,{time}));z.style.display='block';return 'ok';};
window.trio=async(tag)=>{const z=document.getElementById('trio');z.innerHTML='';for(const time of TIMES){const c=document.createElement('canvas');const cv=await SBArt.cover(tag,{time});c.width=cv.width;c.height=cv.height;c.getContext('2d').drawImage(cv,0,0);z.appendChild(c);}z.style.display='flex';return 'ok';};
(async()=>{
  await SBArt.ready;
  const lines=['painter: '+SBArt._gl];
  for(const t of TIMES){
    const t0=performance.now();
    const cvs=await Promise.all(TAGS.map(tag=>SBArt.cover(tag,{time:t})));
    const ms=performance.now()-t0;
    TAGS.forEach((tag,i)=>show(cells[tag+'-'+t],cvs[i]));
    const tm=SBArt._timings.filter(x=>x.time===t);
    lines.push(`${t}: all 6 in ${ms.toFixed(0)} ms  (`+tm.map(x=>`${x.tag} ${x.compose.toFixed(0)}+${x.paint.toFixed(0)}`).join(', ')+')  compose+paint ms');
    document.getElementById('t').textContent=lines.join('\n');
    await new Promise(r=>setTimeout(r,30));
  }
  const sw=document.getElementById('sw');
  const t0=performance.now();
  for(const tag of TAGS){const L=SBArt.linen(CLOTH[tag],512);
    sw.insertAdjacentHTML('beforeend',`<figure><div class="tile" style="background-image:url(${L.albedo.toDataURL()})"></div>${tag} ${CLOTH[tag]}</figure>`);}
  const L=SBArt.linen(CLOTH.Travel,512);sw.insertAdjacentHTML('beforeend',`<figure><div class="tile" style="background-image:url(${L.normal.toDataURL()})"></div>normal (Travel)</figure>`);
  const P=SBArt.paper(1024);sw.insertAdjacentHTML('beforeend',`<figure><div class="tile" style="background-image:url(${P.toDataURL()});background-size:192px 192px"></div>paper 1024 (×2 tiled)</figure><figure><div class="tile" style="background-image:url(${P.toDataURL()});background-size:384px 384px;background-position:192px 192px"></div>paper seam (centre)</figure>`);
  lines.push(`textures: 6 linens@512 + paper@1024 in ${(performance.now()-t0).toFixed(0)} ms`);
  document.getElementById('t').textContent=lines.join('\n');
  window.LAB_DONE=true;
})().catch(e=>{window.LAB_DONE=true;document.getElementById('t').textContent='ERROR '+e.message;throw e;});
</script>
