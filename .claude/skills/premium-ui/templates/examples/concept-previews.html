<title>Notes Concept Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: concept notes on the left, a live phone on the right; stacks phone-first on narrow screens. Single dark look by choice. */
:root{
  --bg:#09090F; --panel:#12131C; --line:#25273A; --fg:#EEEAE2; --muted:#A4A2B0; --accent:#FFB86B;
  --display:'Fraunces',Georgia,'Times New Roman',serif; --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --hand:'Caveat','Bradley Hand',cursive;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin:0 auto;padding-block:28px 48px}
header h1{font-family:var(--display);font-weight:350;font-size:clamp(30px,4.4vw,44px);letter-spacing:-.025em;margin:0;text-wrap:balance}
header p{color:var(--muted);margin:.5em 0 0;max-width:62ch;font-size:15px;line-height:1.55}
.tabs{display:flex;gap:4px;margin:22px 0 26px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{font:600 13px var(--ui);color:var(--muted);background:none;border:0;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tabs .rec{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:7px;vertical-align:middle}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;align-items:start}
.info{min-width:0;padding-top:8px}
.eyebrow{font:600 11px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0}
.info h2{font-family:var(--display);font-weight:350;font-style:italic;font-size:clamp(36px,5vw,54px);letter-spacing:-.03em;line-height:1;margin:.25em 0 .35em}
.lede{font-size:16px;line-height:1.6;max-width:52ch;margin:0;color:var(--fg)}
.info h3{font:600 11px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:30px 0 6px}
.tries{list-style:none;margin:0;padding:0}
.tries li{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.tries li:last-child{border-bottom:1px solid var(--line)}
.tries b{font-weight:600}
.tries span{color:var(--muted)}
.palette{display:flex;gap:8px;margin-top:6px}
.palette i{width:34px;height:34px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.why{margin:22px 0 0;font-size:14px;line-height:1.6;color:var(--muted);max-width:56ch}
.foot{margin-top:18px;font-size:12.5px;line-height:1.55;color:var(--muted);opacity:.8;max-width:56ch}
.device{padding:10px;border-radius:58px;background:linear-gradient(150deg,#2B2C35,#0C0C11 60%);box-shadow:inset 0 0 0 1px #393A46,0 50px 90px -35px rgba(0,0,0,.85),0 0 140px -30px var(--glow);transition:box-shadow .6s}
.device[data-c="paper"]{--glow:rgba(255,186,120,.28)}
.device[data-c="constellation"]{--glow:rgba(120,130,255,.32)}
.device[data-c="pond"]{--glow:rgba(70,200,205,.26)}
.screen{position:relative;overflow:hidden;border-radius:48px;height:min(800px,calc(100vh - 60px));min-height:560px;aspect-ratio:390/844;background:#000;isolation:isolate}
@media (max-width:840px){
  .stage{grid-template-columns:minmax(0,1fr);gap:32px}
  .device{order:-1;justify-self:center;border-radius:50px}
  .screen{height:auto;min-height:0;width:min(calc(100vw - 54px),390px);border-radius:40px}
  .tries li{grid-template-columns:minmax(0,1fr);gap:2px}
}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;display:block}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#000;z-index:8;pointer-events:none}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 32px;font:700 14px var(--ui);color:#F4F1E8;z-index:7;pointer-events:none;letter-spacing:.01em}
.status .bat{width:24px;height:11px;border:1.5px solid rgba(244,241,232,.7);border-radius:3px;position:relative}
.status .bat::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:#F4F1E8;border-radius:1px}
.topbar{position:absolute;top:54px;left:22px;right:22px;display:flex;flex-direction:column;gap:9px;z-index:4;pointer-events:none}
.brand{font:600 10.5px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:rgba(244,241,232,.55)}
#search{pointer-events:auto;font:500 13px var(--ui);color:#F4F1E8;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:9px 15px;width:100%;box-sizing:border-box;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#search::placeholder{color:rgba(244,241,232,.42)}
.hint,.toast{position:absolute;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;font:600 12px var(--ui);color:#F4F1E8;background:rgba(10,10,16,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);padding:9px 15px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis;transition:opacity .5s,transform .5s cubic-bezier(.2,0,0,1)}
.hint{bottom:30px}
.hint.gone{opacity:0;transform:translate(-50%,8px)}
.toast{bottom:80px;opacity:0;transform:translate(-50%,8px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.editor{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:62px 24px 30px;opacity:0;transform:translateY(12px);transition:opacity .22s ease,transform .32s cubic-bezier(.2,0,0,1);color:#F4F1E8;z-index:5}
.editor.show{opacity:1;transform:none}
.ed-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ed-bar button{font:600 13px var(--ui);border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit}
#edDone{background:#F4F1E8;color:#0B0E22;border-color:transparent}
.hold{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hold::before{content:"";position:absolute;inset:0;background:var(--ink,#FF8A5B);opacity:.55;transform:scaleX(0);transform-origin:left;transition:transform .2s ease}
.hold.charging::before{transform:scaleX(1);transition:transform .9s linear}
.hold span{position:relative}
.ed-meta{font:600 10.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink,#FFB86B);margin-top:18px}
#edTitle{font:400 31px/1.15 var(--display);letter-spacing:-.02em;background:none;border:0;color:inherit;padding:0;outline:none;width:100%}
#edBody{flex:1;resize:none;background:none;border:0;color:rgba(244,241,232,.86);font:400 16px/1.65 var(--ui);outline:none;padding:0}
#edTitle::placeholder,#edBody::placeholder{color:currentColor;opacity:.38}
[data-concept="paper"] .editor{inset:70px 12px 20px;padding:16px 18px 18px 42px;background:#F1E8D8;color:#24316F;border-radius:3px;box-shadow:0 30px 60px -18px rgba(0,0,0,.65)}
[data-concept="paper"] .editor::before{content:"";position:absolute;left:31px;top:0;bottom:0;width:1px;background:rgba(200,70,70,.35)}
[data-concept="paper"] #edTitle{font:700 36px/1.1 var(--hand);color:#24316F}
[data-concept="paper"] #edBody{font:400 15px/26px var(--display);color:#2A2620;background-image:repeating-linear-gradient(to bottom,transparent 0 25px,rgba(70,110,175,.24) 25px 26px);background-attachment:local}
[data-concept="paper"] .ed-bar button{border-color:rgba(36,49,111,.28);background:transparent;color:#24316F}
[data-concept="paper"] #edDone{background:#24316F;color:#F1E8D8}
[data-concept="paper"] .ed-meta{color:rgba(36,49,111,.6);margin-top:10px}
[data-concept="paper"] .hold::before{background:#C84646;opacity:.25}
[data-concept="pond"] #edDone{background:var(--ink);color:#061417}
@media (prefers-reduced-motion: reduce){.editor,.hint,.toast{transition:opacity .15s}}
</style>

<div class="wrap">
  <header>
    <h1>Notes Concept Lab</h1>
    <p>Three directions for the notes app. Each phone is live: tap, hold, drag, and type. Pick the one you love and I'll build it in Flutter.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Concepts">
    <button role="tab" id="tab-paper" data-c="paper" aria-selected="false">A · Paper Atelier</button>
    <button role="tab" id="tab-constellation" data-c="constellation" aria-selected="true">B · Constellation<span class="rec" title="Recommended"></span></button>
    <button role="tab" id="tab-pond" data-c="pond" aria-selected="false">C · Thought Pond</button>
  </nav>

  <main class="stage">
    <section class="info" id="info" aria-live="polite"></section>
    <div class="device" id="device" data-c="constellation">
      <div class="screen" id="screen" data-concept="constellation">
        <canvas id="cv" role="img" aria-label="Interactive concept preview"></canvas>
        <div class="island"></div>
        <div class="status"><span>9:41</span><span class="bat"></span></div>
        <div class="topbar"><span class="brand" id="brand"></span><input id="search" type="search" autocomplete="off" aria-label="Search notes"></div>
        <div class="hint" id="hint"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="editor" id="editor" hidden>
          <div class="ed-bar"><button id="edDone" type="button">Done</button><button id="edDel" class="hold" type="button"><span>Hold to delete</span></button></div>
          <div class="ed-meta" id="edMeta"></div>
          <input id="edTitle" placeholder="Title" aria-label="Note title" autocomplete="off">
          <textarea id="edBody" placeholder="Start writing…" aria-label="Note text"></textarea>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const screen=$('#screen'),cv=$('#cv'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1,now=performance.now()/1000;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>v<a?a:v>b?b:v;
const eo=t=>1-Math.pow(1-clamp(t,0,1),3);
const eio=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const TAU=Math.PI*2;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mix(a,b,t){const A=a.split(',').map(Number),B=b.split(',').map(Number);return A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')}
function spring(s,t,dt){s.v+=(-180*(s.x-t)-24*s.v)*dt;s.x+=s.v*dt}

const NOTES=[
 {id:1,topic:'travel',title:'Lisbon trip',body:'Take tram 28 early, before the crowds. Pastéis de Belém before 9. Ask Rui which miradouro has the best sunset.',ago:35},
 {id:2,topic:'travel',title:'Lisbon packing',body:'Linen shirts, walking shoes, EU adapter, sunscreen, the small camera.',ago:180},
 {id:3,topic:'travel',title:'Kyoto someday',body:"Philosopher's Path in early April. Stay one night in a machiya. Learn 20 phrases first.",ago:9000},
 {id:4,topic:'work',title:'Q3 pitch ideas',body:'Lead with the retention curve. Cut slide 7. Demo offline mode live, not as a video.',ago:60},
 {id:5,topic:'work',title:'App bug list',body:'Keyboard covers Save on iPhone SE. White flash on launch in dark mode. Sync badge never clears.',ago:1440},
 {id:6,topic:'work',title:'Pitch rehearsal',body:'Rehearse with Arjun on Thursday. Keep the demo under 3 minutes.',ago:300},
 {id:7,topic:'bread',title:'Sourdough log',body:'Day 4: starter doubled in 6 hours. Try 78% hydration on Saturday and a longer cold proof.',ago:600},
 {id:8,topic:'bread',title:'Bread shopping',body:'Rye flour, rice flour for the banneton, a new lame.',ago:4300},
 {id:9,topic:'personal',title:'Books to read',body:'Piranesi. The Overstory. Klara and the Sun. Re-read Invisible Cities.',ago:12000},
 {id:10,topic:'personal',title:"Mom's birthday",body:'Order the orchid on the 12th. Call Priya about the dinner booking. Card from all of us.',ago:2000},
 {id:11,topic:'health',title:'Run plan',body:'Tuesday: 6 × 800 m intervals. Saturday: 14 km long run at an easy pace.',ago:900},
];
const cloneNotes=()=>NOTES.map(n=>({...n}));
let nextId=100;
function ago(m){if(m<1)return'just now';if(m<60)return Math.round(m)+' min ago';if(m<1440)return Math.round(m/60)+' h ago';return Math.round(m/1440)+' d ago'}

function makeNoise(size,alpha){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');const d=g.createImageData(size,size);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.random()*alpha}g.putImageData(d,0,0);return c}
const grain=makeNoise(160,34);
const grainPat=ctx.createPattern(grain,'repeat');

const wrapCache=new Map();
function wrapText(text,font,maxW,maxLines){const key=font+'|'+maxW+'|'+maxLines+'|'+text;let r=wrapCache.get(key);if(r)return r;ctx.font=font;const words=(text||'').split(/\s+/).filter(Boolean);const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;if(lines.length>=maxLines){cur='';break}}else cur=t}if(cur&&lines.length<maxLines)lines.push(cur);wrapCache.set(key,lines);return lines}
if(document.fonts)document.fonts.ready.then(()=>wrapCache.clear());

function glow(x,y,R,col,a){if(R<=0||a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R,0,TAU);ctx.fill()}
function drawBloom(x,y,k,core,mid,edge){const R=k*Math.hypot(W,H)*1.1;if(R<1)return;ctx.globalCompositeOperation='source-over';const g=ctx.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,mid);g.addColorStop(1,edge);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R,0,TAU);ctx.fill();ctx.globalCompositeOperation='lighter';glow(x,y,R*.6,core,.5*(1-k)+.05);ctx.globalCompositeOperation='source-over';ctx.strokeStyle=`rgba(${core},${.55*(1-k)})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,R,0,TAU);ctx.stroke()}

/* ---------- shared UI ---------- */
const ed=$('#editor'),edT=$('#edTitle'),edB=$('#edBody'),edDone=$('#edDone'),edDel=$('#edDel'),edMeta=$('#edMeta');
const hint=$('#hint'),toastEl=$('#toast'),search=$('#search'),brand=$('#brand');
let edCtx=null,hintT=0,toastT=0;
function toast(t){toastEl.textContent=t;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2600)}
function hideHint(){hint.classList.add('gone')}
function openEditor(note,opts){edCtx={note,opts,orig:note.title+'\u0000'+note.body};edT.value=note.title;edB.value=note.body;edMeta.textContent=note.title||note.body?'Edited '+ago(note.ago):'New note';edDel.querySelector('span').textContent=opts.delLabel;ed.hidden=false;requestAnimationFrame(()=>ed.classList.add('show'));if(!note.title&&!note.body)setTimeout(()=>edT.focus({preventScroll:true}),260)}
function closeEditor(reason){if(!edCtx)return;const c=edCtx;edCtx=null;c.note.title=edT.value.trim();c.note.body=edB.value.trim();const changed=c.orig!==c.note.title+'\u0000'+c.note.body;if(changed)c.note.ago=0;ed.classList.remove('show');if(ed.contains(document.activeElement))document.activeElement.blur();setTimeout(()=>{if(!edCtx)ed.hidden=true},240);if(reason==='delete')c.opts.onDelete();else c.opts.onClose(changed,!c.note.title&&!c.note.body)}
edDone.addEventListener('click',()=>closeEditor('done'));
let holdT=0;
function holdStart(){edDel.classList.add('charging');clearTimeout(holdT);holdT=setTimeout(()=>{edDel.classList.remove('charging');closeEditor('delete')},900)}
function holdEnd(){clearTimeout(holdT);edDel.classList.remove('charging')}
edDel.addEventListener('pointerdown',holdStart);
['pointerup','pointerleave','pointercancel'].forEach(e=>edDel.addEventListener(e,holdEnd));
edDel.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();holdStart()}});
edDel.addEventListener('keyup',e=>{if(e.key==='Enter'||e.key===' ')holdEnd()});
ed.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor('done')});

/* =========================================================
   B · CONSTELLATION
   ========================================================= */
const TINT_B={travel:'160,200,255',work:'255,196,140',bread:'255,226,170',personal:'214,176,255',health:'170,255,214',new:'255,214,170'};
const LY=162;
function drawStar(x,y,r,b,col){if(r<=0||b<=0)return;const R=r*7;const g=ctx.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,`rgba(255,252,245,${b})`);g.addColorStop(.1,`rgba(${col},${b*.75})`);g.addColorStop(.35,`rgba(${col},${b*.14})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R,0,TAU);ctx.fill();ctx.fillStyle=`rgba(255,253,248,${b})`;ctx.beginPath();ctx.arc(x,y,r*.45,0,TAU);ctx.fill();if(r>3){const L=r*5*b;ctx.strokeStyle=`rgba(255,250,240,${b*.35})`;ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(x-L,y);ctx.lineTo(x+L,y);ctx.moveTo(x,y-L);ctx.lineTo(x,y+L);ctx.stroke()}}
const B={
 brand:'Constellation',searchLabel:'Search the sky',hint:'Pull down to gather your stars into a list',
 init(){
  this.notes=cloneNotes();const r=rng(11);
  const P={1:[.2,.27],2:[.37,.35],3:[.22,.44],4:[.63,.24],5:[.83,.31],6:[.69,.4],7:[.2,.63],8:[.38,.71],9:[.68,.59],10:[.84,.68],11:[.52,.85]};
  this.stars=this.notes.map(n=>({note:n,x:P[n.id][0],y:P[n.id][1],ph:r()*TAU,sp:.6+r()*1.4,depth:.55+r()*.45,born:-9,pulse:0,charge:0,chargeAt:0}));
  this.dust=Array.from({length:260},()=>({x:r(),y:r(),d:.15+r()*.55,s:.4+r()*1.1,ph:r()*TAU,sp:.5+r()*2}));
  this.names={travel:'The Wanderer',work:'The Forge',bread:'The Hearth',personal:'The Garden',health:'The Runner'};
  this.pull={x:0,v:0,target:0};this.par={x:0,y:0,tx:0,ty:0};this.q='';this.fx=[];this.flash=0;this.shoot=null;this.nextShoot=now+3;this.bloom=null;this.p=null;this.pending=null;this.dragPull=false;this.hov=null;this.order=[];this.rh=50;
 },
 hit(x,y){const pp=clamp(this.pull.x,0,1);if(pp>.5){const i=Math.floor((y-LY+this.rh/2)/this.rh);return this.order[i]||null}let best=null,bd=30;for(const s of this.stars){if(s.dying||s.fade)continue;const d=Math.hypot(s.sx-x,s.sy-y);if(d<bd){bd=d;best=s}}return best},
 match(s){return(s.note.title+' '+s.note.body).toLowerCase().includes(this.q)},
 search(q){this.q=q.trim().toLowerCase()},
 hover(x,y){this.hov=[x,y];this.par.tx=-(x/W-.5)*30;this.par.ty=-(y/H-.5)*30},
 leave(){this.hov=null;this.par.tx=0;this.par.ty=0},
 down(x,y){if(this.bloom||this.pending)return;const s=this.hit(x,y);this.p={x0:x,y0:y,t0:now,moved:false,star:s,pull0:this.pull.x};if(s&&this.pull.x<.1)s.chargeAt=now+.28},
 move(x,y){const p=this.p;if(!p)return;const dx=x-p.x0,dy=y-p.y0;if(!p.moved&&Math.hypot(dx,dy)>8){p.moved=true;if(p.star){p.star.chargeAt=0}}if(p.moved&&(this.dragPull||Math.abs(dy)>Math.abs(dx)*.6)){this.dragPull=true;this.pull.x=clamp(p.pull0+dy/280,0,1);this.pull.v=0}},
 up(x,y){const p=this.p;this.p=null;if(!p)return;if(p.star)p.star.chargeAt=0;
  if(this.dragPull){this.dragPull=false;const P=this.pull;P.target=p.pull0>.5?(P.x<.8?0:1):(P.x>.22?1:0);if(P.target===1)hideHint();return}

/* ---------- concept notes ---------- */
const INFO={
 paper:{tag:'Concept A',name:'Paper Atelier',line:'Each note is a sheet of handmade paper on a warm desk. You handle notes like real paper: pick them up, slide them around, and crumple the ones you are done with.',
  tries:[['Tap + New','A fresh sheet slides off the pad and opens'],['Tap a sheet','It lifts off the desk and becomes the page you write on'],['Drag or fling','Sheets slide with weight and friction'],['Hold a sheet','It crumples while you hold. Let go early and it smooths back out'],['Flick a paper ball','Throw it off the desk to delete'],['Double-tap a ball','It smooths back into a sheet (undo)']],

  tries:[['Tap empty sky','A new star ignites and opens a page'],['Tap a star','It blooms into the note'],['Hold a star','It charges up, then goes supernova (delete)'],['Pull down','The sky gathers into a list, newest first. Pull up to scatter it back'],['Type in search','Only matching stars keep shining'],['Move your cursor','The sky shifts in layers, like tilting the phone. Hover near a constellation to read its name']],
